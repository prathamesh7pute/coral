name: Publish Root Package

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Root-package-only publish flow until scoped workspace releases are added in Phase 23.
      - run: npm ci
      - run: npm run check:ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm publish
